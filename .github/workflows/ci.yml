name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Lint, typecheck, unit + Storybook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # test:storybook runs its stories in a real Chromium via
      # @vitest/browser-playwright, so it needs the browser binary too.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:storybook

  build:
    name: Build (shared by e2e + Lighthouse)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `output: 'standalone'` (next.config.ts) skips static assets - copy
      # them in so the uploaded artifact is a complete, self-contained server
      # that downstream jobs can run without a `pnpm install` of the app's
      # own runtime deps.
      - name: Assemble standalone server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          # standalone's own build output lives in the dot-directory
          # `.next/standalone/.next` - upload-artifact drops dotfiles unless
          # told otherwise, which silently produced a server.js with no
          # build to serve.
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright e2e
    needs: build
    runs-on: ubuntu-latest
    env:
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    env:
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone

      - run: pnpm lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          # same dotfile-dropping behavior as the standalone-build upload
          # above - without this, lhci's own reports never make it into
          # the artifact even though they're written to disk.
          include-hidden-files: true
          retention-days: 7
